# Services: programs ZDOS starts in the background at boot, as root
# NAME=true starts NAME.APP;
# NAME=true fifo 28 (or rr, and a priority 0-31, higher first; default rr 16).
# SSHD: the SSH server (settings in SSHD.CFG; docs/SSH.md):
SSHD=false
# HTTPZ: the web server (settings in HTTPZ.CFG; docs/HTTPZ.md):
HTTPZ=false
# DHCPD: the DHCP server (settings in DHCPD.CFG; docs/NETWORK.md):
DHCPD=false
# DNSD: the DNS server; names from HOSTS.CFG (settings in DNSD.CFG):
DNSD=false
