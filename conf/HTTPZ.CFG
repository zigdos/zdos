# HTTPZ, the web server (docs/HTTPZ.md).
# Started at boot with HTTPZ=true in SERVICES.CFG.
# Lines left out keep the defaults shown or stated.

# Ports; HTTPS_PORT=0: no HTTPS. HTTPS_REDIRECT=true sends http:// to https://
PORT=80
HTTPS_PORT=443
HTTPS_REDIRECT=false

# The certificate (PEM, the chain after it) and its key (ECDSA P-256).
# Made self-signed at the first start if missing; replace them with your own:
CERT=C:/USERS/HTTPZ/httpz.crt
KEY=C:/USERS/HTTPZ/httpz.key

# The pages, and the folder in it whose scripts and programs answer requests:
# /functions/hello runs hello.lua there:
SERVER_ROOT=C:/USERS/HTTPZ/www
CGI_DIR=functions
INDEX=index.html index.htm

# Interpreters by extension (up to 16); NAME.app in CGI_DIR runs as it is:
CGI lua=C:/APPS/lua.app
CGI py=C:/APPS/micropython.app
CGI_TIMEOUT=10

# Limits: the largest download, the largest upload, max connections:
MAX_FILE_SIZE=25MB
MAX_BODY=1MB
MAX_CLIENTS=32

# Threads serving requests (left out: one per core, 2 to 16):
#WORKERS=4

# Folder listings where there is no index file:
DIRLIST=false

# The user it runs as (made at the first start, without a login):
USER=HTTPZ

# The log (none if not specified):
# LOG=C:/DATA/LOGS/httpz.log
