# DNSD, the DNS server (docs/NETWORK.md). 
# Started at boot with DNSD=true in SERVICES.CFG.
# Answers HOSTS.CFG's names itself (A and PTR)
# and asks the servers for the rest.
# This file and HOSTS.CFG are reread when they change (or DNSD -reload).

# The cards whose machines it answers: true (all but NAT='s outside ones)
# or card numbers (from 0): CARDS=1,2
CARDS=true

# The DNS servers asked (up to 8). Left out: ZDOS's own:
# SERVERS=1.1.1.1, 8.8.8.8

# Answers kept (0: none), and the TTL of HOSTS.CFG's answers in seconds:
CACHE=128
TTL=60

# The log (none if not specified):
# LOG=C:\DATA\LOGS\dnsd.log
