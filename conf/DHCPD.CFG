# DHCPD, the DHCP server (docs/NETWORK.md).
# Started at boot with DHCPD=true in SERVICES.CFG;
# reread when it changes (or DHCPD -reload).
# Leases are kept in memory, across rereads.

# Addresses for the machines on a card's network:
# RANGE=CARD FIRST-LAST [MINUTES]
# The card numbered from 0 (it needs a fixed address).
# Leases of MINUTES (default 1440, a day). Several lines: several ranges.
# RANGE=1 192.168.50.100-192.168.50.199 1440

# The DNS server the machines get: ROUTER (card's) or up to 4 addresses.
# Left out: the card's address if a DNS server (DNSD) runs here,
# else ZDOS's own DNS servers.
# DNS=ROUTER

# The log (none if not specified):
# LOG=C:\DATA\LOGS\dhcpd.log

# Clients: MAC ADDRESS (sep: - or :), up to 256, inside or outside a range:
# 52-54-00-12-34-56 192.168.50.7
