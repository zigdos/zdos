# ZIGDOS system-wide configuration
[Display]
TERM=vt100
CLSONSTART=false
# Lines kept after they leave the screen:
SCROLLBACK=64KB
FONT=spleen-12x24
# RESOLUTION=1280x800
[System]
SHELL=\APPS\COMMAND.APP
TEMP=\TEMP
KEYB=EN
MOUSESPEED=120
# Metal x86_64: PS/2 keyboard and mouse (auto, on, off):
# PS2INPUT=auto
# Metal: cores kept for tasks that ask for them:
# ISOLCPUS=2,3
# Codepage is BIOS only when FONT is not firmware:
CODEPAGE=CP437
[Network]
NETWORK=true
# Metal and BIOS: the network on a CPU core of its own (true):
# NETCORE=true
# The network's core: its own (1 and up; else the last):
# NETCPU=1
# The task NET's priority (0-31):
# NETPRIO=20
# Metal and BIOS: cards polled instead of interrupts:
# NETPOLLED=true
# DHCP, or a fixed address with its mask and router
IPV4=DHCP
# IPV4=192.168.1.50
# NETMASK=255.255.255.0
# ROUTER=192.168.1.1
# Up to 8 DNS servers (with DHCP too: they replace DHCP's)
# DNS=1.1.1.1,8.8.8.8
# More cards (docs/NETWORK.md), numbered from 0:
# NET1=192.168.50.1/24
# Forwarding between the cards, and routes (NETWORK/BITS ROUTER, ...)
# ROUTING=true
# ROUTE=10.1.0.0/16 192.168.50.2
# Cards 0 and 1 as bridge (it takes NET0='s settings)
# BRIDGE=0,1
# NAT behind card n (forwarding on too):
# NAT=0
# FORWARD=tcp 8080 192.168.50.5:80, udp 27015 192.168.50.6
