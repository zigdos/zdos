[package]
name = "cratetest"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.9"
chrono = "0.4"
sha2 = "0.10"
crossbeam-channel = "0.5"
rayon = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
